services:
  - type: web
    name: krishimitra-ai
    runtime: node
    plan: free
    rootDir: backend
    installCommand: npm ci
    buildCommand: cd ../frontend && npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: WEATHER_PROVIDER
        value: mock