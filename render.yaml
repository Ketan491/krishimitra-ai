# Export: 2026-08-30T06:43:48Z (from Render)
services:
  - type: web
    name: krishimitra-ai
    runtime: node
    repo: https://github.com/Ketan491/krishimitra-ai
    plan: free
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        sync: false
      - key: WEATHER_PROVIDER
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: JWT_SECRET
        sync: false
      # Razorpay. sync: false keeps the values out of this repo - set them in
      # the Render dashboard. Without them the API reports online payment as
      # disabled and checkout falls back to Cash on Delivery.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        sync: false
      # Gemini (AI chat). Unset is safe: geminiService keeps its client null and
      # the chat route reports the feature as unavailable instead of crashing.
      - key: GEMINI_API_KEY
        sync: false
    region: oregon
    # NOT `npm ci`. frontend is an npm workspace, so `ci` replays the ROOT
    # lockfile - and that lockfile is platform-specific: it carries only the
    # win32-x64 native binaries (1 of 20 @typescript/typescript-* variants, 0 of
    # the esbuild/rollup ones). On Linux it installs 174 packages and then dies
    # with "Unable to resolve @typescript/typescript-linux-x64".
    # `npm install` re-resolves optionalDependencies against the real platform,
    # so the Linux binaries actually get fetched.
    buildCommand: cd ../frontend && npm install --include=optional && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    rootDir: backend