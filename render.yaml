# Export: 2026-08-30T06:43:48Z (from Render)
services:
  - type: web
    name: krishimitra-ai
    runtime: node
    repo: https://github.com/Ketan491/krishimitra-ai
    plan: free
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        sync: false
      - key: WEATHER_PROVIDER
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: JWT_SECRET
        sync: false
      # Razorpay. sync: false keeps the values out of this repo - set them in
      # the Render dashboard. Without them the API reports online payment as
      # disabled and checkout falls back to Cash on Delivery.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        sync: false
      # Gemini (AI chat). Unset is safe: geminiService keeps its client null and
      # the chat route reports the feature as unavailable instead of crashing.
      - key: GEMINI_API_KEY
        sync: false
    region: oregon
    # Deployment sequence: clean install -> npm ci -> build -> start.
    #
    # Why `npm ci` and not `npm install`:
    #  - npm ci removes node_modules itself before installing. That matters here
    #    because Render restores a cached dependency tree between builds. A tree
    #    left over from the old npm-workspaces layout is the most likely source
    #    of "Cannot read properties of null (reading 'edgesOut')": npm's tree
    #    builder dereferenced a workspace package that the new package.json no
    #    longer declared. Starting from an empty directory removes that state.
    #  - It installs exactly what the committed package-lock.json files pin.
    #
    # Why the explicit `rm -rf`: npm ci already does this, so it is
    # belt-and-braces. It costs nothing and removes any doubt about a restored
    # cache directory.
    #
    # Why `npm cache clean --force`: Render keeps the npm cache under
    # /opt/render/.cache, which is also where the failing build wrote its debug
    # log. Clearing it once per build rules out corrupted cache metadata. This
    # is the one line that can be dropped once builds are stable.
    #
    # Why no `--prefix`: it makes npm resolve the project root from a different
    # base directory, which is a less-trodden path through arborist. Plain `cd`
    # keeps each install unambiguous.
    #
    # Paths are relative to rootDir (backend). The frontend bundle is written to
    # frontend/dist and served as static files by backend/app.js, so the service
    # still starts with `node server.js` from the backend directory.
    buildCommand: rm -rf node_modules ../frontend/node_modules && npm cache clean --force && npm ci && cd ../frontend && npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    rootDir: backend