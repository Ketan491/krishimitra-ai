# Export: 2026-08-30T06:43:48Z (from Render)
services:
  - type: web
    name: krishimitra-ai
    runtime: node
    repo: https://github.com/Ketan491/krishimitra-ai
    plan: free
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        sync: false
      - key: WEATHER_PROVIDER
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: JWT_SECRET
        sync: false
      # Razorpay. sync: false keeps the values out of this repo - set them in
      # the Render dashboard. Without them the API reports online payment as
      # disabled and checkout falls back to Cash on Delivery.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        sync: false
      # Gemini (AI chat). Unset is safe: geminiService keeps its client null and
      # the chat route reports the feature as unavailable instead of crashing.
      - key: GEMINI_API_KEY
        sync: false
    region: oregon
    # Two separate problems made the Linux build fail, and both are addressed
    # here.
    #
    # 1. `npm ci` replays a lockfile, and a lockfile written on one platform
    #    cannot express another's native binaries. Ours carried 1 of the 20
    #    @typescript/typescript-* variants and none of the esbuild/rollup ones,
    #    so the build died with "Unable to resolve
    #    @typescript/typescript-linux-x64". `npm install` re-resolves
    #    optionalDependencies against the platform it is running on, so the
    #    Linux binaries actually get fetched.
    #
    # 2. A single `npm install` at the repo root walked the npm workspaces tree
    #    and crashed npm itself: "Cannot read properties of null (reading
    #    'edgesOut')". Workspaces are gone from package.json now, so backend and
    #    frontend install independently.
    #
    # Paths are relative to rootDir (backend), hence the ../ prefixes.
    buildCommand: npm install --prefix ../backend && npm install --prefix ../frontend && npm run build --prefix ../frontend
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    rootDir: backend