# Export: 2026-08-30T06:43:48Z (from Render)
services:
  - type: web
    name: krishimitra-ai
    runtime: node
    repo: https://github.com/Ketan491/krishimitra-ai
    plan: free
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        sync: false
      - key: WEATHER_PROVIDER
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: JWT_SECRET
        sync: false
    region: oregon
    buildCommand: cd ../frontend && npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    rootDir: backend